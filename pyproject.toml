[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-remote-job-radar"
version = "0.1.0"
description = "Taiwan-aware international remote job discovery and tracking"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "feedparser>=6.0,<7", "PyYAML>=6,<7", "pydantic>=2.7,<3", "streamlit>=1.36,<2", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

